<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 120" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Fixed property base map</title>
  <desc id="map-desc">40 by 120 feet. North is left; driveway and west boundary are at the bottom. Structural positions are estimated from an illustration.</desc>
  <defs>
    <pattern id="wood" width="2" height="2" patternUnits="userSpaceOnUse"><path d="M0 0v2 M1 0v2" stroke="#785c42" stroke-opacity=".18" stroke-width=".12"/></pattern>
    <pattern id="steps" width="2" height="1.2" patternUnits="userSpaceOnUse"><path d="M0 0h2" stroke="#818d85" stroke-width=".18"/></pattern>
  </defs>
  <polygon id="lawn" data-kind="ground" points="0,0 40,0 40,120 0,120" fill="#d5e5b7" stroke="#8e9989" stroke-width="0.16"><title>Yard / planting ground</title></polygon>
  <polygon id="back-path" data-kind="path" points="0,16 4,13 9,5 15,0 18,0 13,8 6,18 0,22" fill="#d9dcd5" stroke="#8e9989" stroke-width="0.16" stroke-dasharray="0.5 0.35"><title>Back path (approximate)</title></polygon>
  <polygon id="patio" data-kind="patio" points="10,19.5 32.9,19.5 32.9,40.1 10,40.1 10,29 20.1,29 20.1,19.5" fill="#d8d6cd" stroke="#8e9989" stroke-width="0.16" stroke-dasharray="0.5 0.35"><title>Patio (approximate)</title></polygon>
  <polygon id="north-side-path" data-kind="path" points="0,52 6.1,52 6.1,102 16.7,102 16.7,120 0,120" fill="#d9dcd5" stroke="#8e9989" stroke-width="0.16" stroke-dasharray="0.5 0.35"><title>North side path (approximate)</title></polygon>
  <polygon id="south-side-path" data-kind="path" points="33,31 40,31 40,92.5 33,92.5" fill="#d9dcd5" stroke="#8e9989" stroke-width="0.16" stroke-dasharray="0.5 0.35"><title>South side path (approximate)</title></polygon>
  <polygon id="driveway" data-kind="driveway" points="16.8,93 30.8,93 31.7,98 30.7,102 30.7,120 16.8,120" fill="#d4d8d7" stroke="#8e9989" stroke-width="0.16" stroke-dasharray="0.5 0.35"><title>Driveway (approximate)</title></polygon>
  <polygon id="porch" data-kind="porch" points="5.8,92.2 16.8,92.2 16.8,98.9 12.3,98.9 12.3,103.3 5.8,103.3" fill="#d3d0c3" stroke="#8e9989" stroke-width="0.16"><title>Porch</title></polygon>
  <polygon id="porch-stairs" data-kind="stairs" points="8.3,103.3 12.3,103.3 12.3,110.7 8.3,110.7" fill="#c1c6bd" stroke="#8e9989" stroke-width="0.16" stroke-dasharray="0.5 0.35"><title>Porch stairs (approximate)</title></polygon>
  <polygon id="north-side-stairs" data-kind="stairs" points="0,52 5.8,52 5.8,56 0,56" fill="#c1c6bd" stroke="#8e9989" stroke-width="0.16" stroke-dasharray="0.5 0.35"><title>North side stairs (approximate)</title></polygon>
  <polygon id="south-side-stairs" data-kind="stairs" points="33,87 40,87 40,92.5 33,92.5" fill="#c1c6bd" stroke="#8e9989" stroke-width="0.16" stroke-dasharray="0.5 0.35"><title>South side stairs (approximate)</title></polygon>
  <polygon id="residence" data-kind="building" points="6.1,43.6 33.3,43.6 33.3,83 34.6,83 34.6,87.9 33.3,87.9 33.3,95.6 16.8,95.6 16.8,92.2 6.1,92.2" fill="#b89067" stroke="#5c4a38" stroke-width="0.4"><title>Residence</title></polygon>
  <polygon points="6.1,43.6 33.3,43.6 33.3,83 34.6,83 34.6,87.9 33.3,87.9 33.3,95.6 16.8,95.6 16.8,92.2 6.1,92.2" fill="url(#wood)"/>
  <rect x="0.2" y="0.2" width="39.6" height="119.6" fill="none" stroke="#4e6951" stroke-width=".4" stroke-dasharray="1 .5"/>
  <g fill="#314837" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="19" y="33" font-size="2.4">Patio</text>
    <text x="20" y="70" font-size="3">Residence</text>
    <text x="11" y="97" font-size="1.8">Porch</text>
    <text x="24" y="111" font-size="2.4">Driveway</text>
  </g>
  <g fill="#314837" font-family="system-ui, sans-serif" font-size="1.6">
    <path d="M7 10H2 M2 10l2-1.2 M2 10l2 1.2" fill="none" stroke="#314837" stroke-width=".35"/><text x="2" y="8">N</text>
    <path d="M2 116h10 M2 115v2 M7 115v2 M12 115v2" fill="none" stroke="#314837" stroke-width=".3"/><text x="7" y="114">10 ft</text>
